<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>yumi live deskpet</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  user-select: none;
}
#stage {
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: transparent;
}
#bubble {
  position: fixed;
  left: 0;
  top: 0;
  transform: translate(-50%, -100%);
  background: rgba(20, 20, 20, 0.88);
  color: #fff;
  border-radius: 12px;
  padding: 5px 12px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 15px;
  white-space: normal;
  max-width: calc(100% - 24px);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
  z-index: 10;
}
#bubble.show {
  opacity: 1;
}
#chatbox {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 48px;
  display: none;
  flex-direction: column;
  background: rgba(18, 18, 18, 0.88);
  color: #fff;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  z-index: 20;
}
#chatbox.show {
  display: flex;
}
#chat-back {
  background: transparent;
  color: #9bd3ff;
  border: 1px solid #3a5a78;
  border-radius: 8px;
  font-size: 14px;
  padding: 4px 10px;
  cursor: pointer;
}
#chat-input-row {
  display: flex;
  gap: 6px;
  padding: 6px 10px;
}
#chat-input {
  flex: 1;
  border-radius: 10px;
  border: 1px solid #3a5a78;
  background: rgba(255, 255, 255, 0.09);
  color: #fff;
  padding: 6px 10px;
  font-size: 14px;
  outline: none;
}
#chat-mic {
  display: none;
  border-radius: 10px;
  border: 1px solid #3a5a78;
  background: rgba(255, 255, 255, 0.09);
  color: #fff;
  width: 38px;
  font-size: 17px;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
}
#chat-mic.show {
  display: block;
}
#chat-mic.recording {
  background: #c0392b;
  border-color: #e74c3c;
  box-shadow: 0 0 12px rgba(231, 76, 60, 0.7);
}
#chat-send {
  border-radius: 10px;
  border: none;
  background: #33b77a;
  color: #fff;
  padding: 0 14px;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bubble"></div>
<div id="chatbox">
  <div id="chat-input-row">
    <button id="chat-back" title="返回 Codex 模式">←</button>
    <input id="chat-input" type="text" placeholder="和 yumi 说点什么…" autocomplete="off" />
    <button id="chat-mic" title="语音输入">🎤</button>
    <button id="chat-send">发送</button>
  </div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="lib/live2d.min.js"></script>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/pixi.min.js"></script>
<script src="lib/pixi-live2d-display.min.js"></script>
<script src="live.js"></script>
</body>
</html>
